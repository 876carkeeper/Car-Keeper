<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>CarKeeper — Vehicle Management</title>
<meta name="description" content="CarKeeper keeps your vehicles, maintenance, repairs and expenses in one beautiful place.">
<meta name="theme-color" content="#06070A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CarKeeper">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#06070A; --bg2:#0A0C11;
  --surface:#101318; --surface2:#151922; --surface3:#1B2028;
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.13);
  --txt:#F4F6FA; --txt2:#A7B0BF; --txt3:#6C7686;
  --blue:#3B82F6; --blue2:#60A5FA; --blueDeep:#1D4ED8;
  --green:#22C97C; --amber:#FFB020; --red:#FF4D57; --violet:#8B5CF6;
  --r-lg:24px; --r-md:18px; --r-sm:12px;
  --tab-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --shadow:0 18px 48px -18px rgba(0,0,0,.85);
}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,sans-serif;
  font-size:15px; line-height:1.45; letter-spacing:-.01em;
  overscroll-behavior-y:none; overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(700px 380px at 12% -8%,rgba(59,130,246,.16),transparent 62%),
   radial-gradient(560px 320px at 92% 6%,rgba(139,92,246,.10),transparent 60%),
   radial-gradient(900px 500px at 50% 108%,rgba(59,130,246,.06),transparent 60%);
}
#app{position:relative;z-index:1;min-height:100vh;max-width:520px;margin:0 auto}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.028em;line-height:1.2}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue2);text-decoration:none}
::selection{background:rgba(59,130,246,.35)}
/* ---------- scrollbars ---------- */
::-webkit-scrollbar{width:0;height:0}

/* ---------- layout ---------- */
.screen{padding:calc(var(--safe-t) + 14px) 18px calc(var(--tab-h) + var(--safe-b) + 30px);animation:fade .28s ease both}
.screen.nopad{padding-left:0;padding-right:0}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap14{gap:14px}
.grow{flex:1;min-width:0}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt22{margin-top:22px}.mt28{margin-top:28px}
.muted{color:var(--txt2)}.dim{color:var(--txt3)}
.tiny{font-size:11.5px;letter-spacing:.02em}
.small{font-size:13px}
.center{text-align:center}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hide{display:none!important}

/* ---------- header ---------- */
.apphead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.apphead h1{font-size:26px}
.apphead .sub{font-size:12.5px;color:var(--txt3);margin-top:3px;letter-spacing:.01em}
.iconbtn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);color:var(--txt2);transition:.18s}
.iconbtn:active{transform:scale(.93);background:var(--surface3)}
.backbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);flex:0 0 auto}

/* ---------- logo ---------- */
.brand{display:flex;align-items:center;gap:11px}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(150deg,#3B82F6,#1D4ED8 55%,#1E3A8A);
  box-shadow:0 8px 24px -8px rgba(59,130,246,.9),inset 0 1px 0 rgba(255,255,255,.28)}
.logo svg{width:23px;height:23px}
.brand b{font-size:17px;letter-spacing:-.03em}

/* ---------- cards ---------- */
.card{background:linear-gradient(168deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.card.flat{background:var(--surface);}
.card.tap{transition:.18s}
.card.tap:active{transform:scale(.985);border-color:var(--line2)}
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);border:1px solid var(--line2);background:linear-gradient(160deg,#151A23,#0B0E13);padding:18px}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(59,130,246,.28),transparent 68%);filter:blur(6px)}
.sectitle{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sectitle h2{font-size:16px;letter-spacing:-.02em}
.sectitle button{font-size:12.5px;color:var(--blue2);font-weight:600}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:16px;
  font-weight:640;font-size:15px;letter-spacing:-.01em;transition:.16s;border:1px solid transparent;white-space:nowrap}
.btn:active{transform:scale(.975)}
.btn.primary{background:linear-gradient(180deg,#4A8CFF,#2563EB);box-shadow:0 12px 28px -14px rgba(59,130,246,1),inset 0 1px 0 rgba(255,255,255,.28);color:#fff}
.btn.ghost{background:var(--surface2);border-color:var(--line2);color:var(--txt)}
.btn.soft{background:rgba(59,130,246,.14);color:var(--blue2);border-color:rgba(59,130,246,.22)}
.btn.danger{background:rgba(255,77,87,.12);color:#FF7A82;border-color:rgba(255,77,87,.25)}
.btn.wide{width:100%}
.btn.sm{height:38px;padding:0 14px;border-radius:12px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.fab{position:fixed;right:18px;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);width:54px;height:54px;border-radius:19px;z-index:40;
  background:linear-gradient(180deg,#4A8CFF,#2563EB);display:grid;place-items:center;color:#fff;
  box-shadow:0 16px 34px -10px rgba(37,99,235,.85),inset 0 1px 0 rgba(255,255,255,.3);transition:.18s}
.fab:active{transform:scale(.92)}
@media(min-width:640px){.fab{right:calc(50% - 260px + 18px)}}

/* ---------- forms ---------- */
.field{display:block;margin-bottom:13px}
.field > label{display:block;font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:7px;letter-spacing:.01em}
.input,select.input,textarea.input{
  width:100%;height:50px;padding:0 15px;border-radius:14px;background:#0C0F14;
  border:1px solid var(--line2);color:var(--txt);font-size:15px;transition:.16s;appearance:none}
textarea.input{height:auto;min-height:88px;padding:13px 15px;line-height:1.5;resize:vertical}
.input:focus{outline:none;border-color:rgba(59,130,246,.65);box-shadow:0 0 0 3.5px rgba(59,130,246,.14);background:#0A0D12}
.input::placeholder{color:#4E5764}
select.input{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%236C7686' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 15px center;padding-right:38px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hint{font-size:11.5px;color:var(--txt3);margin-top:6px;line-height:1.4}
.err{font-size:12.5px;color:#FF7A82;margin-top:8px;min-height:16px}
.seg{display:flex;background:#0B0E13;border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;border-radius:11px;font-size:13px;font-weight:600;color:var(--txt2);transition:.16s}
.seg button.on{background:var(--surface3);color:var(--txt);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.switch{position:relative;width:46px;height:28px;border-radius:99px;background:#22272F;border:1px solid var(--line2);transition:.2s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8A93A3;transition:.2s}
.switch.on{background:rgba(59,130,246,.9);border-color:transparent}
.switch.on::after{left:22px;background:#fff}

/* ---------- chips / badges ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chip{flex:0 0 auto;height:36px;padding:0 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--txt2);display:inline-flex;align-items:center;gap:7px;transition:.16s}
.chip.on{background:rgba(59,130,246,.16);border-color:rgba(59,130,246,.4);color:#CFE0FF}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.badge.ok{background:rgba(34,201,124,.14);color:#4BE39B}
.badge.warn{background:rgba(255,176,32,.14);color:#FFC45C}
.badge.bad{background:rgba(255,77,87,.15);color:#FF8189}
.badge.info{background:rgba(59,130,246,.15);color:#8AB8FF}
.badge.neutral{background:rgba(255,255,255,.07);color:var(--txt2)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}

/* ---------- vehicle card ---------- */
.vcard{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line2);background:#0A0D12;transition:.2s}
.vcard:active{transform:scale(.986)}
.vcard .art{position:relative;height:164px;background:
  radial-gradient(80% 110% at 50% 0%,rgba(59,130,246,.16),transparent 64%),
  linear-gradient(180deg,#171D27 0%,#111620 55%,#0A0D12 100%)}
.vcard .art img{width:100%;height:100%;object-fit:cover}
.vcard .art .ph{position:absolute;inset:0;display:grid;place-items:center;color:#93A6C0;opacity:.34}
.vcard .art .fade{position:absolute;inset:0;background:linear-gradient(to top,#0A0D12 0%,rgba(10,13,18,.55) 32%,transparent 72%)}
.vcard .body{position:relative;padding:0 16px 15px;margin-top:-14px}
.vcard .nick{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--blue2);margin-bottom:5px}
.vcard .nm{font-size:18px;font-weight:700;letter-spacing:-.03em}
.vcard .sub{font-size:12.5px;color:var(--txt3);margin-top:3px}
.vcard .foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.vcard .mi{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700}
.vcard .mi span{font-size:11px;color:var(--txt3);font-weight:600;margin-left:3px}

/* ---------- list rows ---------- */
.lrow{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface3);flex:0 0 auto;color:var(--txt2)}
.lrow .t{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.lrow .s{font-size:12px;color:var(--txt3);margin-top:2px}
.lrow .amt{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.stat .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);font-weight:650}
.stat .v{font-size:22px;font-weight:750;letter-spacing:-.035em;margin-top:7px;font-variant-numeric:tabular-nums}
.stat .d{font-size:11.5px;color:var(--txt3);margin-top:3px}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);
  background:rgba(8,10,14,.82);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border-top:1px solid var(--line);display:flex}
.tabbar .in{display:flex;width:100%;max-width:520px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--txt3);transition:.16s;position:relative}
.tab svg{width:23px;height:23px;transition:.18s}
.tab span{font-size:9.5px;font-weight:650;letter-spacing:.01em}
.tab.on{color:var(--blue2)}
.tab.on svg{transform:translateY(-1px)}
.tab.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:2.5px;border-radius:2px;background:var(--blue)}

/* ---------- sheet / modal ---------- */
#modal-root{position:fixed;inset:0;z-index:100;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);opacity:0;transition:.24s;pointer-events:auto}
.scrim.on{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:92vh;overflow-y:auto;
  background:linear-gradient(180deg,#12161D,#0B0E13);border-radius:26px 26px 0 0;border:1px solid var(--line2);border-bottom:0;
  padding:10px 20px calc(22px + var(--safe-b));transform:translateY(102%);transition:transform .3s cubic-bezier(.32,.72,0,1);pointer-events:auto;box-shadow:0 -20px 60px rgba(0,0,0,.7)}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:#2C323C;margin:4px auto 16px}
.sheet h3{font-size:20px;margin-bottom:6px}
.sheet .sh-sub{font-size:13px;color:var(--txt3);margin-bottom:18px}
.sheet-actions{display:flex;gap:10px;margin-top:20px}
.sheet-actions .btn{flex:1}

/* ---------- toast ---------- */
#toast-root{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + var(--safe-b) + 78px);z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{max-width:88%;background:rgba(24,29,37,.98);border:1px solid var(--line2);border-radius:14px;padding:11px 16px;font-size:13.5px;
  box-shadow:var(--shadow);animation:pop .22s ease both;display:flex;gap:9px;align-items:center}
.toast.ok{border-color:rgba(34,201,124,.4)}
.toast.bad{border-color:rgba(255,77,87,.4)}

/* ---------- auth / onboarding ---------- */
.authwrap{min-height:100vh;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 26px) 22px calc(26px + var(--safe-b))}
.authhero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:8px 0 24px}
.authhero h1{font-size:33px;line-height:1.1;letter-spacing:-.04em}
.authhero p{font-size:15px;color:var(--txt2);line-height:1.55;max-width:330px}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:99px;background:rgba(59,130,246,.12);
  border:1px solid rgba(59,130,246,.25);color:#9CC4FF;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;align-self:flex-start}
.steps{display:flex;gap:5px;margin-bottom:24px}
.steps i{flex:1;height:3px;border-radius:2px;background:#20252E;transition:.3s}
.steps i.on{background:var(--blue)}
.pickcard{display:flex;align-items:center;gap:13px;padding:15px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);transition:.16s;text-align:left;width:100%}
.pickcard.on{border-color:rgba(59,130,246,.65);background:rgba(59,130,246,.09)}
.pickcard .em{font-size:20px;width:34px;text-align:center}
.pickcard .t{font-size:14px;font-weight:650}
.pickcard .s{font-size:11.5px;color:var(--txt3);margin-top:2px}

/* ---------- charts ---------- */
.donut{width:132px;height:132px;flex:0 0 auto;position:relative}
.donut .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .ctr b{font-size:19px;font-weight:750;letter-spacing:-.03em;display:block}
.donut .ctr i{font-size:10px;color:var(--txt3);font-style:normal;letter-spacing:.05em;text-transform:uppercase}
.legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.legend .li{display:flex;align-items:center;gap:8px;font-size:12.5px}
.legend .li b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:650}
.bars{display:flex;align-items:flex-end;gap:8px;height:104px;margin-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars .b .bar{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#3F86F7,#1D4ED8);min-height:3px;transition:height .5s cubic-bezier(.32,.72,0,1)}
.bars .b .lb{font-size:9.5px;color:var(--txt3);letter-spacing:.04em}
.bars .b.cur .bar{background:linear-gradient(180deg,#7FB0FF,#3B82F6);box-shadow:0 0 16px rgba(59,130,246,.5)}

/* ---------- misc ---------- */
.empty{text-align:center;padding:44px 24px;border:1px dashed var(--line2);border-radius:var(--r-lg);background:rgba(255,255,255,.014)}
.empty .em{width:56px;height:56px;border-radius:18px;background:var(--surface2);display:grid;place-items:center;margin:0 auto 14px;border:1px solid var(--line)}
.empty h3{font-size:16px;margin-bottom:6px}
.empty p{font-size:13px;color:var(--txt3);line-height:1.5;max-width:260px;margin:0 auto}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:1.5px;background:linear-gradient(180deg,rgba(59,130,246,.5),rgba(59,130,246,.05))}
.tl{position:relative;padding-bottom:18px}
.tl::before{content:"";position:absolute;left:-22px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.tl.ok::before{background:var(--green);box-shadow:0 0 0 3px rgba(34,201,124,.18)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--txt3)}
.kv .v{font-weight:600;text-align:right;max-width:60%}
.plan{border-radius:20px;border:1.5px solid var(--line);padding:18px;background:linear-gradient(170deg,var(--surface2),var(--surface))}
.plan.best{border-color:rgba(34,201,124,.5);background:linear-gradient(170deg,rgba(34,201,124,.09),var(--surface))}
.plan.cur{border-color:rgba(59,130,246,.55)}
.plan .price{font-size:32px;font-weight:800;letter-spacing:-.045em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.plan ul{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.plan li{font-size:12.5px;color:var(--txt2);display:flex;gap:8px;line-height:1.35}
.plan li svg{flex:0 0 auto;margin-top:2px;color:var(--green)}
.chat{display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.msg{max-width:88%;padding:12px 15px;border-radius:18px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.sys{align-self:center;background:transparent;border:1px dashed var(--line2);color:var(--txt3);font-size:12px;max-width:100%;text-align:center}
.chatbar{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + var(--safe-b));background:rgba(8,10,14,.92);backdrop-filter:blur(20px);
  border-top:1px solid var(--line);padding:10px 14px;z-index:45}
.chatbar .in{max-width:520px;margin:0 auto;display:flex;gap:9px;align-items:flex-end}
.chatbar textarea{flex:1;min-height:44px;max-height:120px;padding:11px 14px;border-radius:20px;background:#12161D;border:1px solid var(--line2);resize:none;font-size:14.5px;line-height:1.35}
.chatbar textarea:focus{outline:none;border-color:rgba(59,130,246,.55)}

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const num = (v, d) => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : (d === undefined ? 0 : d); };
const int = (v, d) => Math.round(num(v, d));
const todayISO = () => new Date().toISOString().slice(0, 10);
const money = (n) => {
  const v = Number(n) || 0;
  return '$' + v.toLocaleString('en-US', { minimumFractionDigits: v % 1 === 0 ? 0 : 2, maximumFractionDigits: 2 });
};
const miles = (n) => Math.round(Number(n) || 0).toLocaleString('en-US');
const fmtDate = (iso) => {
  if (!iso) return '—';
  const d = new Date(iso + 'T12:00:00');
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
};
const fmtShort = (iso) => {
  if (!iso) return '—';
  const d = new Date(iso + 'T12:00:00');
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
};
const daysFrom = (iso) => {
  if (!iso) return null;
  const d = new Date(iso + 'T12:00:00').getTime();
  return Math.round((d - new Date(new Date().toDateString()).getTime()) / 86400000);
};
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const addMonths = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setMonth(d.getMonth() + n); return d.toISOString().slice(0, 10); };
const monthKey = (iso) => (iso || '').slice(0, 7);
const thisMonth = () => new Date().toISOString().slice(0, 7);
const rel = (iso) => {
  const d = daysFrom(iso);
  if (d === null) return '—';
  if (d === 0) return 'today';
  if (d === 1) return 'tomorrow';
  if (d === -1) return 'yesterday';
  if (d < 0) return Math.abs(d) + 'd ago';
  if (d < 30) return 'in ' + d + 'd';
  return 'in ' + Math.round(d / 30) + 'mo';
};
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ---------------- persistence ---------------- */
const Store = {
  db: null,
  load(){
    try {
      const raw = localStorage.getItem(DB_KEY);
      this.db = raw ? JSON.parse(raw) : this.blank();
    } catch (e) { console.warn('db load failed', e); this.db = this.blank(); }
    if (!this.db || !this.db.users) this.db = this.blank();
    return this.db;
  },
  blank(){ return { v: 1, users: [], session: null, vehicles: [], services: [], expenses: [], fuel: [], mods: [], reminders: [], odo: [] }; },
  save(){
    try {
      localStorage.setItem(DB_KEY, JSON.stringify(this.db));
      return true;
    } catch (e) {
      toast('Storage is full — remove a photo or receipt to continue.', 'bad');
      return false;
    }
  },
  reset(){ localStorage.removeItem(DB_KEY); this.db = this.blank(); }
};

const Cfg = {
  data: { aiKey: '', aiModel: 'gpt-4o-mini', supabaseUrl: '', supabaseKey: '' },
  load(){ try { const r = localStorage.getItem(CFG_KEY); if (r) this.data = Object.assign(this.data, JSON.parse(r)); } catch (e) {} return this.data; },
  save(){ try { localStorage.setItem(CFG_KEY, JSON.stringify(this.data)); } catch (e) {} }

/* images live in IndexedDB (localStorage is too small for photos) */
const Img = (() => {
  let dbp = null;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('carkeeper-img', 1);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('files')) r.result.createObjectStore('files'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  return {
    async put(id, dataUrl){ const db = await open();
      return new Promise((res, rej) => { const t = db.transaction('files', 'readwrite'); t.objectStore('files').put(dataUrl, id); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
    async get(id){ const db = await open();
      return new Promise((res, rej) => { const t = db.transaction('files', 'readonly'); const q = t.objectStore('files').get(id); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); }); },
    async del(id){ const db = await open();
      return new Promise((res) => { const t = db.transaction('files', 'readwrite'); t.objectStore('files').delete(id); t.oncomplete = res; t.onerror = res; }); },
    /* resize a File to a compact data URL before storing */
    async compress(file, max, q){
      max = max || 1400; q = q || 0.72;
      const bmp = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = fr.result; }; fr.onerror = rej; fr.readAsDataURL(file); });
      const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', q);
    }
  };
})();
/* hydrate <img data-img="id"> placeholders after each render */
const imgCache = new Map();
async function hydrateImages(root){
  const els = $$('[data-img]', root || document);
  for (const el of els){
    const id = el.getAttribute('data-img');
    if (!id) continue;
    let url = imgCache.get(id);
    if (!url){ try { url = await Img.get(id); } catch (e) { url = null; } if (url) imgCache.set(id, url); }
    if (url){ el.src = url; el.style.opacity = 1; }
  }
}

/* ---------------- auth (PBKDF2) ---------------- */
async function hashPass(pass, salt){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 120000, hash: 'SHA-256' }, key, 256);
  return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
}
const rnd = () => { const a = new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a).map(b => b.toString(16).padStart(2, '0')).join(''); };

const Auth = {
  user(){ const db = Store.db; return db.session ? db.users.find(u => u.id === db.session) || null : null; },
  find(email){ return Store.db.users.find(u => u.email.toLowerCase() === String(email || '').trim().toLowerCase()); },
  async signup(name, email, pass){
    name = String(name || '').trim();
    email = String(email || '').trim().toLowerCase();
    if (name.length < 2) throw new Error('Please enter your name.');
    if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)) throw new Error('That email address looks invalid.');
    if (String(pass).length < 8) throw new Error('Password must be at least 8 characters.');
    if (this.find(email)) throw new Error('An account with that email already exists.');
    const salt = rnd();
    const u = { id: uid(), name, email, salt, hash: await hashPass(pass, salt), plan: 'free', planCycle: null,
      createdAt: new Date().toISOString(), prefs: { units: 'mi', milesPerMonth: 1000, leadDays: 30, leadMiles: 500, reminders: true, currency: 'USD' } };
    Store.db.users.push(u);
    Store.db.session = u.id;
    Store.save();
    return u;
  },
  async login(email, pass){
    const u = this.find(email);
    if (!u) throw new Error('No account found for that email.');
    const h = await hashPass(String(pass), u.salt);
    if (h !== u.hash) throw new Error('Incorrect password. Try again.');
    Store.db.session = u.id; Store.save();
    return u;
  },
  logout(){ Store.db.session = null; Store.save(); },
  async resetPassword(email, pass){
    const u = this.find(email);
    if (!u) throw new Error('No account found for that email.');
    if (String(pass).length < 8) throw new Error('Password must be at least 8 characters.');
    u.salt = rnd(); u.hash = await hashPass(pass, u.salt); Store.save();
    return u;
  },
  async changePassword(cur, next){
    const u = this.user();
    if (await hashPass(cur, u.salt) !== u.hash) throw new Error('Current password is incorrect.');
    if (String(next).length < 8) throw new Error('New password must be at least 8 characters.');
    u.salt = rnd(); u.hash = await hashPass(next, u.salt); Store.save();
  }
};

/* ---------------- domain selectors ---------------- */
const D = {

  cur(){

  services(vehId){ return Store.db.services.filter(s => s.vehicleId === vehId && this.owns(s)).sort((a, b) => (b.date || '').localeCompare(a.date || '')); },
  expenses(vehId){ return Store.db.expenses.filter(e => (!vehId || e.vehicleId === vehId) && this.owns(e)).sort((a, b) => (b.date || '').localeCompare(a.date || '')); },
  fuel(vehId){ return Store.db.fuel.filter(f => (!vehId || f.vehicleId === vehId) && this.owns(f)).sort((a, b) => (b.date || '').localeCompare(a.date || '')); },
  mods(vehId){ return Store.db.mods.filter(m => (!vehId || m.vehicleId === vehId) && this.owns(m)); },
  reminders(vehId){ return Store.db.reminders.filter(r => (!vehId || r.vehicleId === vehId) && this.owns(r)); },
  odo(vehId){ return Store.db.odo.filter(o => o.vehicleId === vehId && this.owns(o)).sort((a, b) => (a.date || '').localeCompare(b.date || '')); },
  owns(o){ return o && o.userId === (Store.db.session || ''); },
  spend(vehId, from, to){
    return this.expenses(vehId).filter(e => (!from || e.date >= from) && (!to || e.date <= to)).reduce((s, e) => s + num(e.amount), 0);

  lifetimeSpend(vehId){ return this.spend(vehId); }
};

/* --------- maintenance status engine --------- */
function avgMilesPerMonth(veh){
  const log = D.odo(veh.id);
  if (log.length >= 2){
    const a = log[0], b = log[log.length - 1];
    const dm = num(b.miles) - num(a.miles);
    const dd = Math.max(1, (new Date(b.date) - new Date(a.date)) / 86400000);
    if (dm > 0 && dd > 20) return Math.round(dm / (dd / 30.4));
  }
  const p = (Auth.user() && Auth.user().prefs) || {};
  return num(p.milesPerMonth, 1000) || 1000;
}

/* Returns due items for a vehicle, sorted by urgency */
function dueItems(veh){
  const svc = D.services(veh.id);
  const prefs = (Auth.user() && Auth.user().prefs) || {};
  const leadDays = num(prefs.leadDays, 30), leadMiles = num(prefs.leadMiles, 500);
  const mpm = avgMilesPerMonth(veh);
  const curMi = num(veh.mileage);
  const out = [];
  for (const t of MT){
    if (!t.mi && !t.mo) continue;
    const last = svc.find(s => s.type === t.id);
    if (!last) {
      out.push({ type: t, last: null, status: 'none', label: 'No record', sort: 9e12 });
      continue;
    }
    const nextDate = t.mo ? addMonths(last.date, t.mo) : null;
    const nextMi = t.mi ? num(last.mileage) + t.mi : null;
    const dDate = nextDate ? daysFrom(nextDate) : null;
    const dMi = nextMi != null ? nextMi - curMi : null;
    let status = 'ok';
    if ((dDate !== null && dDate < 0) || (dMi !== null && dMi < 0)) status = 'over';
    else if ((dDate !== null && dDate <= leadDays) || (dMi !== null && dMi <= leadMiles)) status = 'soon';
    const monthsLeft = dDate !== null ? dDate / 30.4 : 99;
    const miMonths = dMi !== null ? dMi / (mpm || 1000) : 99;
    out.push({ type: t, last, nextDate, nextMi, dDate, dMi, status, sort: Math.min(monthsLeft, miMonths) });
  }
  const order = { over: 0, soon: 1, ok: 2, none: 3 };
  return out.sort((a, b) => (order[a.status] - order[b.status]) || (a.sort - b.sort));
}

function healthOf(veh){
  const items = dueItems(veh).filter(i => i.status !== 'none');
  if (!items.length) return { score: 100, level: 'ok', label: 'No data yet', over: 0, soon: 0, ok: 0, none: dueItems(veh).length };
  const over = items.filter(i => i.status === 'over').length;
  const soon = items.filter(i => i.status === 'soon').length;
  const ok = items.length - over - soon;
  const score = clamp(Math.round(100 - (over * 22) - (soon * 8)), 5, 100);
  const level = over ? 'bad' : (soon ? 'warn' : 'ok');
  const label = over ? 'Needs attention' : (soon ? 'Service coming up' : 'All up to date');
  return { score, level, label, over, soon, ok, none: dueItems(veh).filter(i => i.status === 'none').length };
}

function activeReminders(){
  const u = Auth.user(); if (!u) return [];
  const out = [];
  for (const v of D.veh()){
    for (const it of dueItems(v)){
      if (it.status === 'over' || it.status === 'soon'){
        out.push({ veh: v, item: it });
      }
    }
  }
  return out.sort((a, b) => (a.item.status === b.item.status ? a.item.sort - b.item.sort : a.item.status === 'over' ? -1 : 1));
}

/* =========================================================
   Stripe billing client — talks only to our own backend.
   No Stripe secret ever reaches the browser.
   ========================================================= */
const PAY = {
  cfg: { configured:false, mode:'test', publishableKey:null, plans:[] },
  loaded: false,
  api(path){ return path.replace(/^\//, ''); },
  async load(){
    try {
      const r = await fetch(this.api('/api/config'), { headers: { 'Accept': 'application/json' } });
      if (!r.ok) throw new Error('no server');
      this.cfg = await r.json();
    } catch (e) {
      this.cfg = { configured:false, mode:'test', publishableKey:null, plans:[] };
    }
    this.loaded = true;
    return this.cfg;
  },
  async post(path, body){
    let r;
    try {
      r = await fetch(this.api(path), { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body || {}) });
    } catch (e) {
      throw new Error('Cannot reach the payments server. Is it running?');
    }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('Request failed (' + r.status + ')'));
    return j;
  },
  async entitlement(email){
    try {
      const r = await fetch(this.api('/api/entitlement?email=' + encodeURIComponent(email)));
      if (!r.ok) return null;
      return await r.json();
    } catch (e) { return null; }
  },
  sync(email){ return this.post('/api/sync', { email }); },
  async checkout(email, plan, cycle){
    const j = await this.post('/api/checkout', { email, plan, cycle });
    if (!j.url) throw new Error('Stripe did not return a checkout URL.');
    location.href = j.url;
  },
  async portal(email){
    const j = await this.post('/api/portal', { email });
    location.href = j.url;
  },
  /* display price from the live Stripe price, falling back to the published list */
  price(planId, cycle){
    const fallback = PLANS[planId] ? (cycle === 'year' ? PLANS[planId].year : PLANS[planId].price) : 0;
    const hit = (this.cfg.plans || []).find(p => p.plan === planId && p.cycle === cycle);
    return hit && hit.amount != null ? hit.amount / 100 : fallback;
  }
};

/* server entitlement is the source of truth for paid plans */
function applyEntitlement(u, ent){
  if (!u || !ent || !ent.verified) return false;
  const sig = (x) => [x.plan, x.planStatus, x.planRenew, !!x.cancelAtPeriodEnd, !!x.paymentFailed].join('|');
  const before = sig(u);
  u.plan = ent.plan || 'free';
  u.planStatus = ent.status || 'none';
  if (ent.cycle) u.planCycle = ent.cycle;
  u.planRenew = ent.currentPeriodEnd || null;
  u.cancelAtPeriodEnd = !!ent.cancelAtPeriodEnd;
  u.paymentFailed = !!ent.paymentFailed;
  u.planSource = ent.source || 'server';
  Store.save();
  return before !== sig(u);
}
async function refreshEntitlement(quiet){
  const u = Auth.user();
  if (!u) return false;
  const ent = await PAY.entitlement(u.email);
  if (!ent) return false;
  const changed = applyEntitlement(u, ent);
  if (changed && !quiet) render();
  return changed;
}
async function pollForActivation(tries){
  const u = Auth.user();
  if (!u) return;
  for (let i = 0; i < (tries || 8); i++){
    try { const ent = await PAY.sync(u.email); if (ent && ent.verified){ applyEntitlement(u, ent); render();
      if (ent.plan !== 'free'){ toast('Subscription active — welcome to ' + PLANS[ent.plan].name.replace('CarKeeper ', ''), 'ok'); return; } } }
    catch (e) { /* server or Stripe not reachable yet — keep polling */ }
    await new Promise(r => setTimeout(r, 1500));
  }
  toast('Payment received. Activation can take a few seconds — pull to refresh.', 'ok');
}

/* delegated events via data-act */
const ACTIONS = {};
function on(name, fn){ ACTIONS[name] = fn; }
function bindAuto(){
  const app = $('#app');
  if (app.dataset.bound) return;
  app.dataset.bound = '1';
  app.addEventListener('click', async (ev) => {
    const t = ev.target.closest('[data-act]');
    if (!t) return;
    const name = t.getAttribute('data-act');
    const fn = ACTIONS[name];
    if (!fn) return;
    ev.preventDefault();
    try { await fn(t, ev); } catch (e) { console.error(e); toast(e.message || 'Something went wrong', 'bad'); }
  });
  app.addEventListener('submit', async (ev) => {
    const f = ev.target.closest('form[data-form]');
    if (!f) return;
    ev.preventDefault();
    const fn = ACTIONS['form:' + f.getAttribute('data-form')];
    if (!fn) return;
    try { await fn(f, ev); } catch (e) { console.error(e); const er = $('.err', f); if (er) er.textContent = e.message || 'Something went wrong'; else toast(e.message, 'bad'); }
  });
  app.addEventListener('change', async (ev) => {
    const t = ev.target.closest('[data-change]');
    if (!t) return;
    const fn = ACTIONS['change:' + t.getAttribute('data-change')];
    if (fn) { try { await fn(t, ev); } catch (e) { toast(e.message, 'bad'); } }
  });
}

function ring(score, level){
  const c = level === 'bad' ? '#FF4D57' : level === 'warn' ? '#FFB020' : '#22C97C';
  const r = 26, circ = 2 * Math.PI * r, off = circ * (1 - score / 100);
  return `<svg viewBox="0 0 64 64" width="64" height="64" style="transform:rotate(-90deg)">
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="5"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${circ}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .8s cubic-bezier(.32,.72,0,1)"/>
  </svg>`;
}
function donut(parts, total, centerLabel){
  const R = 56, C = 2 * Math.PI * R;
  let acc = 0;
  const segs = parts.filter(p => p.value > 0).map(p => {
    const len = (p.value / total) * C;
    const s = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${p.color}" stroke-width="16"
      stroke-dasharray="${len - 2.5} ${C - len + 2.5}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"/>`;
    acc += len; return s;
  }).join('');
  return `<div class="donut"><svg viewBox="0 0 140 140" width="132" height="132">
      <circle cx="70" cy="70" r="${R}" fill="none" stroke="rgba(255,255,255,.055)" stroke-width="16"/>${segs}</svg>
    <div class="ctr"><div><b>${centerLabel}</b><i>total</i></div></div></div>`;
}

      ${dueItems(v || {id:'', mileage:0}).slice(0, 5).map(it => `<div class="lrow">

      </div>`).join('')}
    </div>
    <button class="btn primary wide mt22" data-act="ob-done">Go to my dashboard ${icon('chev', 17)}</button>`;
  }

  const titles = ['Step 1 of 3', 'Step 2 of 3', 'Step 3 of 3', 'All set'];
  return `<div class="authwrap">
    <div class="row between" style="margin-bottom:20px">
      <div class="small dim">${titles[st.step]}</div>
      ${st.step < 3 ? `<button class="small dim" data-act="ob-skip">Skip</button>` : ''}

    ${dots}
    ${body}
  </div>`;
}

function vehicleName(v){
  if (!v) return 'Vehicle';
  if (v.nickname) return v.nickname;
  return [v.year, v.make, v.model].filter(Boolean).join(' ') || 'My vehicle';
}
function vehicleDesc(v){
  return [v.year, v.make, v.model, v.trim].filter(Boolean).join(' ') || 'Vehicle';
}

on('ob-skip', () => { state.ob.step = Math.min(3, state.ob.step + 1); render(); });
on('ob-back', () => { state.ob.step = Math.max(0, state.ob.step - 1); render(); });
on('ob-toggle', (t) => { state.ob.reminders = !state.ob.reminders; t.classList.toggle('on'); });
on('ob-done', () => {
  const u = Auth.user(); u.onboarded = true; Store.save();
  go('home');
});

ACTIONS['form:ob0'] = (f) => {
  const d = Object.fromEntries(new FormData(f));
  if (!d.year || !d.make || !d.model) throw new Error('Year, make and model are required.');
  const y = int(d.year);
  if (y < 1900 || y > new Date().getFullYear() + 1) throw new Error('Enter a valid model year.');
  state.ob.data = Object.assign({}, state.ob.data, d);
  state.ob.step = 1; render();
};
ACTIONS['form:ob1'] = (f) => {
  const d = Object.fromEntries(new FormData(f));
  if (!String(d.mileage).trim()) throw new Error('Enter your current mileage.');
  Object.assign(state.ob.data, d, { mileage: int(d.mileage) });
  state.ob.step = 2; render();
};
ACTIONS['form:ob2'] = (f) => {
  const d = Object.fromEntries(new FormData(f));
  const u = Auth.user();
  u.prefs = Object.assign({}, u.prefs, { milesPerMonth: int(d.milesPerMonth, 1000), leadDays: int(d.leadDays, 30), reminders: state.ob.reminders !== false });
  // create the vehicle
  const v = createVehicle(Object.assign({}, state.ob.data, { userId: u.id }));
  Store.db.odo.push({ id: uid(), userId: u.id, vehicleId: v.id, miles: num(v.mileage), date: todayISO() });
  Store.save();
  state.vehicleId = v.id;
  state.ob.step = 3; render();
};

function createVehicle(data){
  const u = Auth.user();
  const v = {
    id: uid(), userId: u.id,
    year: int(data.year), make: String(data.make || '').trim(), model: String(data.model || '').trim(),
    trim: String(data.trim || '').trim(), engine: String(data.engine || '').trim(),
    mileage: int(data.mileage), vin: String(data.vin || '').trim().toUpperCase(), plate: String(data.plate || '').trim().toUpperCase(),
    nickname: String(data.nickname || '').trim(), photo: data.photo || null,
    tireSize: String(data.tireSize || '').trim(), warranty: String(data.warranty || '').trim(),
    resale: num(data.resale, 0), createdAt: new Date().toISOString()
  };
  Store.db.vehicles.push(v);
  Store.save();
  return v;
}

function avgMonthly(vehId){
  const from = new Date(); from.setMonth(from.getMonth() - 11); const f = from.toISOString().slice(0, 10);
  const total = D.spend(vehId, f);
  return Math.round(total / 12);
}
function calcMpg(fuel){
  const rows = fuel.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '') || num(a.odometer) - num(b.odometer));
  let totalMi = 0, totalGal = 0;
  for (let i = 1; i < rows.length; i++){
    const prev = rows[i - 1], cur = rows[i];
    const d = num(cur.odometer) - num(prev.odometer);
    if (prev.full && cur.full && d > 0 && num(cur.gallons) > 0){
      totalMi += d; totalGal += num(cur.gallons);
    }
  }
  return totalGal > 0 ? totalMi / totalGal : 0;
}

async function sendAI(text){
  text = String(text || '').trim();
  if (!text || state.aiBusy) return;
  const cfg = Cfg.load();
  if (!cfg.aiKey){ toast('Connect an AI model first', 'bad'); return; }
  state.aiLog.push({ role: 'user', text });
  state.aiDraft = '';
  state.aiBusy = true;
  render();
  const v = D.cur();
  const due = v ? dueItems(v).filter(d => d.status !== 'none').slice(0, 6).map(d => `${d.type.name} (${d.status}, next ${d.nextDate || '—'} / ${d.nextMi ? miles(d.nextMi) + ' mi' : '—'})`).join('; ') : 'none';
  const sys = `You are CarKeeper's vehicle assistant. Be concise, practical and plain-spoken for a non-mechanic. Structure answers as: likely causes (most to least probable), what to check or tell a mechanic, and cost ranges only when reasonably supported — label them as estimates in USD. Never claim to diagnose from a description; recommend a professional inspection for safety-critical issues (brakes, steering, fuel leaks, smoke, overheating). Vehicle: ${v ? `${v.year} ${v.make} ${v.model} ${v.trim || ''}, ${miles(v.mileage)} miles` : 'not specified'}. Tracked maintenance: ${due || 'none'}.`;
  try {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.aiKey },
      body: JSON.stringify({ model: cfg.aiModel || 'gpt-4o-mini', temperature: 0.4,
        messages: [{ role: 'system', content: sys }, ...state.aiLog.slice(-8).map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }))] })
    });
    if (!res.ok){
      const t = await res.text();
      throw new Error(res.status === 401 ? 'API key rejected (401). Check the key in Assistant settings.' : 'AI request failed (' + res.status + '). ' + t.slice(0, 140));
    }
    const j = await res.json();
    const out = j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message.content : 'No response.';
    state.aiLog.push({ role: 'assistant', text: out });
  } catch (e) {
    state.aiLog.push({ role: 'assistant', text: '⚠️ ' + (e.message || 'Network error') });
  }
  state.aiBusy = false;
  render();
  const log = $('#chatlog'); if (log) window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function bindModal(){
  const root = $('#modal-root');
  if (root.dataset.bound) return;
  root.dataset.bound = '1';
  root.addEventListener('click', async (ev) => {
    const t = ev.target.closest('[data-act]');
    if (!t) return;
    const fn = ACTIONS[t.getAttribute('data-act')];
    if (!fn) return;
    ev.preventDefault();
    try { await fn(t, ev); } catch (e) { console.error(e); toast(e.message || 'Something went wrong', 'bad'); }
  });
  root.addEventListener('change', async (ev) => {
    const t = ev.target.closest('[data-file]');
    if (!t) return;
    const fn = ACTIONS['file:' + t.getAttribute('data-file')];
    if (fn) { try { await fn(t, ev); } catch (e) { toast(e.message || 'Upload failed', 'bad'); } }
  });

function field(label, inner, hint){
  return `<div class="field"><label>${esc(label)}</label>${inner}${hint ? `<div class="hint">${esc(hint)}</div>` : ''}</div>`;
}
function input(name, opts){
  opts = opts || {};
  return `<input class="input" name="${name}" ${opts.type ? 'type="' + opts.type + '"' : ''} ${opts.inputmode ? 'inputmode="' + opts.inputmode + '"' : ''}
    ${opts.placeholder ? 'placeholder="' + esc(opts.placeholder) + '"' : ''} ${opts.value != null && opts.value !== '' ? 'value="' + esc(opts.value) + '"' : ''}
    ${opts.step ? 'step="' + opts.step + '"' : ''} ${opts.maxlength ? 'maxlength="' + opts.maxlength + '"' : ''} ${opts.required ? 'required' : ''}>`;
}
function select(name, options, value){
  return `<select class="input" name="${name}">${options.map(([v, l]) => `<option value="${esc(v)}" ${String(value) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
}

function openServiceForm(id, presetType){
  const cur = id ? Store.db.services.find(x => x.id === id) : null;
  const v = cur ? D.vehById(cur.vehicleId) : D.cur();
  if (!v) return toast('Add a vehicle first', 'bad');
  const typeId = (cur && cur.type) || presetType || 'oil';
  const t = mtById(typeId);
  const lastOf = D.services(v.id).find(s => s.type === typeId);
  const sugMi = num(v.mileage) + (t.mi || 0);
  const sugDate = addMonths(todayISO(), t.mo || 12);
  const body = `<form id="sform">
    ${field('Service type', select('type', MT.map(m => [m.id, m.name]), typeId))}
    <div class="grid2">
      ${field('Date', input('date', { type: 'date', value: cur ? cur.date : todayISO(), required: true }))}
      ${field('Mileage', input('mileage', { inputmode: 'numeric', placeholder: String(v.mileage), value: cur ? cur.mileage : v.mileage, required: true }))}
    </div>
    <div class="grid2">
      ${field('Cost', input('cost', { inputmode: 'decimal', placeholder: t.cost ? String(t.cost) : '0', value: cur ? cur.cost : '' }))}
      ${field('Next service date', input('nextDate', { type: 'date', value: cur ? cur.nextDate : sugDate }))}
    </div>
    ${field('Next service mileage', input('nextMileage', { inputmode: 'numeric', value: cur ? cur.nextMileage : sugMi }), 'Leave as-is to use the factory interval (' + (t.mi ? miles(t.mi) + ' mi' : '—') + ' / ' + (t.mo ? t.mo + ' mo' : '—') + ').')}
    ${field('Service provider', input('shop', { placeholder: 'Honda of Springfield', value: cur ? cur.shop : '' }))}
    ${field('Notes', `<textarea class="input" name="notes" placeholder="What was done, parts used, symptoms…">${cur ? esc(cur.notes) : ''}</textarea>`)}
    ${can('receipts') ? `<div class="field"><label>Receipts & photos</label>
      <label class="btn ghost sm" style="display:inline-flex;cursor:pointer">${icon('camera', 15)} Attach
        <input type="file" accept="image/*" multiple data-file="receipt" style="display:none"></label>
      <div id="rcptPrev" class="row gap8 mt8" style="flex-wrap:wrap;margin-top:8px">${(cur && cur.receipts ? cur.receipts : []).map(r => `<img data-img="${esc(r)}" style="width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--line2);opacity:0;transition:opacity .3s" alt="">`).join('')}</div>
    </div>` : `<div class="card" style="padding:12px;border-color:rgba(59,130,246,.25);background:rgba(59,130,246,.06)">
      <div class="row between"><div class="tiny muted">Receipt & invoice storage</div><button class="tiny" style="color:#8AB8FF;font-weight:700" data-act="open-plan" type="button">Premium</button></div></div>`}
    <div class="err"></div>
  </form>`;
  state.tmpReceipts = cur && cur.receipts ? cur.receipts.slice() : [];
  const sh = sheet({
    title: id ? 'Edit service record' : 'Log a service',
    sub: vehicleDesc(v) + ' · ' + miles(v.mileage) + ' mi',
    body,
    actions: `${closeBtn()}<button class="btn primary" id="sSave">${id ? 'Save changes' : 'Save record'}</button>`
  });
  const typeSel = $('select[name=type]', sh);
  typeSel.addEventListener('change', () => {
    const nt = mtById(typeSel.value);
    const nd = $('input[name=nextDate]', sh), nm = $('input[name=nextMileage]', sh), cc = $('input[name=cost]', sh);
    if (nd) nd.value = addMonths(todayISO(), nt.mo || 12);
    if (nm) nm.value = num(d$('input[name=mileage]', sh)) + (nt.mi || 0);
    if (cc && !cc.value) cc.placeholder = String(nt.cost || 0);
  });
  $('#sSave', sh).addEventListener('click', () => {
    const f = $('#sform', sh);
    const d = Object.fromEntries(new FormData(f));
    const err = $('.err', f);
    if (!d.mileage || int(d.mileage) <= 0) { err.textContent = 'Enter the mileage at service.'; return; }
    const rec = {
      id: cur ? cur.id : uid(), userId: v.userId, vehicleId: v.id,
      type: d.type, date: d.date || todayISO(), mileage: int(d.mileage), cost: num(d.cost),
      shop: String(d.shop || '').trim(), notes: String(d.notes || '').trim(),
      nextDate: d.nextDate || null, nextMileage: d.nextMileage ? int(d.nextMileage) : null,
      receipts: state.tmpReceipts || [], createdAt: cur ? cur.createdAt : new Date().toISOString()
    };
    if (cur) Object.assign(cur, rec);
    else Store.db.services.push(rec);
    // keep odometer current
    if (rec.mileage > num(v.mileage)){ v.mileage = rec.mileage; Store.db.odo.push({ id: uid(), userId: v.userId, vehicleId: v.id, miles: rec.mileage, date: rec.date }); }
    // mirror into expenses
    if (rec.cost > 0){
      const linked = Store.db.expenses.find(e => e.serviceId === rec.id);
      if (linked){ linked.amount = rec.cost; linked.date = rec.date; linked.odometer = rec.mileage; linked.note = mtById(rec.type).name; }
      else Store.db.expenses.push({ id: uid(), userId: v.userId, vehicleId: v.id, serviceId: rec.id, category: 'maintenance',
        amount: rec.cost, date: rec.date, note: mtById(rec.type).name, odometer: rec.mileage });
    }
    Store.save();
    closeSheet(); toast(id ? 'Record updated' : 'Service logged', 'ok'); render();
  });
}

/* =========================================================
   Cloud sync (optional Supabase wiring)
   ========================================================= */
const Cloud = {
  cfg(){ return Cfg.load(); },
  ready(){ const c = this.cfg(); return !!(c.supabaseUrl && c.supabaseKey && c.cloudToken); },
  base(){ return String(this.cfg().supabaseUrl || '').replace(/\/+$/, ''); },
  headers(auth){
    const c = this.cfg();
    const h = { 'apikey': c.supabaseKey, 'Content-Type': 'application/json' };
    h['Authorization'] = 'Bearer ' + (auth || c.cloudToken || c.supabaseKey);
    return h;
  },
  async test(){
    const c = this.cfg();
    if (!c.supabaseUrl || !c.supabaseKey) throw new Error('Enter your project URL and anon key first.');
    const res = await fetch(this.base() + '/rest/v1/vehicles?select=id&limit=1', { headers: this.headers() });
    if (res.status === 404) throw new Error('Connected, but the tables do not exist yet. Run the SQL in the README.');
    if (!res.ok) throw new Error('Connection failed (' + res.status + '). Check the URL and anon key.');
    return true;
  },
  async auth(email, pass, signup){
    const c = this.cfg();
    if (!c.supabaseUrl || !c.supabaseKey) throw new Error('Enter your project URL and anon key first.');
    const url = this.base() + '/auth/v1/' + (signup ? 'signup' : 'token?grant_type=password');
    const res = await fetch(url, { method: 'POST', headers: { 'apikey': c.supabaseKey, 'Content-Type': 'application/json' },
      body: JSON.stringify(signup ? { email, password: pass } : { email, password: pass }) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.msg || j.error_description || j.message || 'Cloud sign-in failed.');
    const token = j.access_token || (j.session && j.session.access_token);
    const uidc = (j.user && j.user.id) || (j.session && j.session.user && j.session.user.id);
    if (!token) throw new Error('Check your email to confirm the cloud account, then connect again.');
    c.cloudToken = token; c.cloudUserId = uidc; c.cloudEmail = email;
    Cfg.save();
    return true;
  },
  async push(){
    if (!this.ready()) throw new Error('Connect a cloud account first.');
    const uidc = this.cfg().cloudUserId;
    const payload = {
      vehicles: Store.db.vehicles.filter(v => v.userId === Store.db.session).map(v => ({ id: v.id, user_id: uidc, data: v, updated_at: new Date().toISOString() }))
    };
    const res = await fetch(this.base() + '/rest/v1/vehicles', { method: 'POST',
      headers: Object.assign(this.headers(), { 'Prefer': 'resolution=merge-duplicates,return=minimal' }), body: JSON.stringify(payload.vehicles) });
    if (!res.ok) throw new Error('Push failed (' + res.status + '): ' + (await res.text()).slice(0, 160));
    // records
    const rows = [];
    const push2 = (table, arr) => rows.push.apply(rows, arr.filter(r => r.userId === Store.db.session).map(r => ({ id: r.id, user_id: uidc, vehicle_id: r.vehicleId, data: r, updated_at: new Date().toISOString() })));
    push2('services', Store.db.services); push2('expenses', Store.db.expenses); push2('fuel', Store.db.fuel);
    push2('mods', Store.db.mods); push2('reminders', Store.db.reminders);
    // group by table
    const byTable = {};
    [['services', Store.db.services], ['expenses', Store.db.expenses], ['fuel', Store.db.fuel], ['mods', Store.db.mods], ['reminders', Store.db.reminders]].forEach(([t, arr]) => {
      byTable[t] = arr.filter(r => r.userId === Store.db.session).map(r => ({ id: r.id, user_id: uidc, vehicle_id: r.vehicleId, data: r, updated_at: new Date().toISOString() }));
    });
    for (const t of Object.keys(byTable)){
      if (!byTable[t].length) continue;
      const r2 = await fetch(this.base() + '/rest/v1/' + t, { method: 'POST',
        headers: Object.assign(this.headers(), { 'Prefer': 'resolution=merge-duplicates,return=minimal' }), body: JSON.stringify(byTable[t]) });
      if (!r2.ok) throw new Error('Push of ' + t + ' failed (' + r2.status + '): ' + (await r2.text()).slice(0, 160));
    }
    return true;
  },
  async pull(){
    if (!this.ready()) throw new Error('Connect a cloud account first.');
    const uidc = this.cfg().cloudUserId;
    const get = async (t) => {
      const res = await fetch(this.base() + '/rest/v1/' + t + '?select=data&user_id=eq.' + uidc, { headers: this.headers() });
      if (!res.ok) throw new Error('Pull of ' + t + ' failed (' + res.status + ')');
      const rows = await res.json();
      return rows.map(r => r.data).filter(Boolean);
    };
    const vehicles = await get('vehicles');
    const map = { services: 'services', expenses: 'expenses', fuel: 'fuel', mods: 'mods', reminders: 'reminders' };
    const sets = { vehicles };
    for (const t of Object.keys(map)) sets[t] = await get(t);
    // merge by id, local wins on ties
    const merge = (key, incoming) => {
      const have = new Map(Store.db[key].map(x => [x.id, x]));
      let added = 0;
      incoming.forEach(r => { if (!have.has(r.id)){ Store.db[key].push(r); added++; } });
      return added;
    };
    let added = merge('vehicles', sets.vehicles);
    ['services', 'expenses', 'fuel', 'mods', 'reminders'].forEach(k => { added += merge(k, sets[k]); });
    Store.save();
    return added;
  }
};

function download(filename, text, mime){
  const blob = new Blob([text], { type: mime || 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
}

      add('vehicles', data.vehicles); add('services', data.services); add('expenses', data.expenses);
      add('fuel', data.fuel); add('mods', data.mods); add('reminders', data.reminders); add('odo', data.odo);
      Store.save(); toast(n + ' records imported', 'ok'); render();
    } catch (e) { toast(e.message, 'bad'); }
  };

});

    <div class="row gap10" style="margin-bottom:16px">
      <button class="backbtn" data-act="back" data-to="settings">${icon('back', 18)}</button>
      <div class="grow"><h1 style="font-size:20px">Subscription</h1>
        <div class="tiny dim">${isPaid ? 'Manage your plan and payment method' : 'Upgrade any time · cancel any time'}</div></div>
      ${cfg.mode === 'test' && cfg.configured ? `<span class="badge warn">Test</span>` : ''}
    </div>

    ${statusLine ? `<div class="card" style="margin-bottom:14px;border-color:${statusLine.tone === 'bad' ? 'rgba(255,77,87,.35)' : statusLine.tone === 'warn' ? 'rgba(255,176,32,.32)' : 'rgba(34,201,124,.3)'};background:${statusLine.tone === 'bad' ? 'rgba(255,77,87,.07)' : statusLine.tone === 'warn' ? 'rgba(255,176,32,.06)' : 'rgba(34,201,124,.06)'}">
      <div class="row between">
        <div><div class="small" style="font-weight:700">${esc(PLANS[current].name)}</div>
          <div class="tiny muted" style="margin-top:3px">${esc(statusLine.text)}</div></div>
        <span class="badge ${statusLine.tone}">${esc((u.planStatus || 'active').replace('_',' '))}</span>
      </div>
      <button class="btn ghost wide sm mt12" data-act="manage-billing">${icon('wallet', 15)} Manage billing & cancellation</button>
    </div>` : ''}

    <div class="seg" style="margin-bottom:18px">
      <button class="${cycle === 'month' ? 'on' : ''}" data-act="plan-cycle" data-c="month">Monthly</button>
      <button class="${cycle === 'year' ? 'on' : ''}" data-act="plan-cycle" data-c="year">Yearly · save 33%</button>
    </div>

    ${!cfg.configured ? `<div class="card" style="margin-bottom:16px;border-color:rgba(255,176,32,.32);background:rgba(255,176,32,.06)">
      <div class="row gap8" style="color:#FFC45C;font-size:12.5px;font-weight:700">${icon('alert', 15)} Payments server not connected</div>
      <div class="tiny muted mt8" style="line-height:1.6">This page needs the CarKeeper backend running with your Stripe keys. Start it with <b style="color:var(--txt2)">npm start</b> and open the app at <b style="color:var(--txt2)">http://localhost:8080</b>. Until then subscriptions can only be previewed locally.</div>
    </div>` : (cfg.mode === 'test' ? `<div class="card" style="margin-bottom:16px;border-color:rgba(59,130,246,.28);background:rgba(59,130,246,.06)">
      <div class="tiny muted" style="line-height:1.6"><b style="color:#8AB8FF">Stripe test mode.</b> No real money moves. Use card 4242 4242 4242 4242, any future expiry date and any CVC.</div>
    </div>` : '')}

    ${defs.map(d => {
      const P = PLANS[d.id];
      const isCur = current === d.id;
      const amount = P.paid ? money(PAY.price(d.id, cycle)) : '$0';
      let cta;
      if (isCur) cta = `<button class="btn ghost wide sm mt16" disabled>Current plan</button>`;
      else if (d.id === 'free') cta = `<button class="btn ghost wide sm mt16" data-act="manage-billing">Cancel in billing portal</button>`;
      else if (isPaid) cta = `<button class="btn ghost wide sm mt16" data-act="manage-billing">Switch plan in billing portal</button>`;
      else cta = `<button class="btn ${d.id === 'basic' ? 'primary' : 'ghost'} wide sm mt16" data-act="buy" data-plan="${d.id}" data-cycle="${cycle}">${d.id === 'basic' ? 'Subscribe' : 'Choose ' + esc(P.name.replace('CarKeeper ', ''))}${P.paid ? ' · ' + amount : ''}</button>`;
      return `<div class="plan ${d.id === 'basic' ? 'best' : ''} ${isCur ? 'cur' : ''}" style="margin-bottom:14px">
        <div class="row between">
          <div class="tiny" style="letter-spacing:.14em;font-weight:800;color:var(--txt2)">${esc(P.name.toUpperCase())}</div>
          ${d.tag ? `<span class="badge ${d.id === 'basic' ? 'ok' : 'neutral'}">${d.tag}</span>` : ''}
        </div>
        <div class="price">${amount}<span style="font-size:13px;font-weight:600;color:var(--txt3);margin-left:3px">/${P.paid ? (cycle === 'year' ? 'year' : 'month') : 'forever'}</span></div>
        ${P.paid ? `<div class="tiny dim">${cycle === 'year' ? money(PAY.price(d.id, 'month')) + ' billed monthly, or ' + amount + ' per year' : 'Billed monthly · cancel any time'}</div>` : `<div class="tiny dim">No card required</div>`}
        <div class="small muted" style="margin-top:10px;line-height:1.5">${d.desc}</div>
        <ul>${FEATURES[d.id].map(f => `<li>${icon('check', 13)}<span>${esc(f)}</span></li>`).join('')}</ul>
        ${cta}
      </div>`;
    }).join('')}

    <div class="card">
      <div class="row gap8" style="justify-content:center;flex-wrap:wrap">
        ${['VISA','Mastercard','AMEX','Debit','Apple Pay','Google Pay'].map(b => `<span class="badge neutral" style="text-transform:none;letter-spacing:0;font-size:10.5px">${b}</span>`).join('')}
      </div>
      <div class="tiny dim center" style="margin-top:10px;line-height:1.6">Payments are processed by Stripe on their secure checkout page. CarKeeper never sees or stores your card number — only the subscription status your account is entitled to.</div>
    </div>

    ${!cfg.configured ? `<div class="card mt16" style="border-style:dashed">
      <div class="tiny dim" style="line-height:1.6">Developer preview: set a plan locally to review gated screens without payments.</div>
      <div class="row gap8 mt12" style="flex-wrap:wrap">
        ${['free','basic','premium'].map(id => `<button class="btn ghost sm" data-act="preview-plan" data-id="${id}" ${current === id ? 'disabled' : ''}>Preview ${esc(PLANS[id].name.replace('CarKeeper ', ''))}</button>`).join('')}
      </div>
    </div>` : ''}

    <div class="tiny dim center mt16" style="line-height:1.6">Subscriptions renew automatically until cancelled. Cancel from the billing portal at any time; access continues to the end of the paid period.</div>
  </div>`;
}

on('plan-cycle', (t) => { state.planCycle = t.dataset.c; render(); });

on('buy', async (t) => {
  const u = Auth.user();
  const planId = t.dataset.plan;
  const cyc = t.dataset.cycle || state.planCycle || 'month';
  if (!PAY.cfg.configured){ toast('Payments are not configured on this server yet', 'bad'); return; }
  const label = t.innerHTML;
  t.disabled = true; t.innerHTML = 'Opening secure checkout…';
  try {
    await PAY.checkout(u.email, planId, cyc);
  } catch (e) {
    t.disabled = false; t.innerHTML = label;
    if (/already has a subscription/i.test(e.message)){
      toast('You already have a subscription — opening billing', '');
      return actions_manageBilling();
    }
    toast(e.message, 'bad');
  }
});

async function actions_manageBilling(){
  const u = Auth.user();
  if (!PAY.cfg.configured){ toast('Payments are not configured on this server yet', 'bad'); return; }
  try { await PAY.portal(u.email); }
  catch (e) { toast(e.message, 'bad'); }
}
on('manage-billing', () => actions_manageBilling());

on('preview-plan', (t) => {
  const u = Auth.user();
  u.plan = t.dataset.id; u.planCycle = state.planCycle || 'month'; u.planSource = 'preview';
  Store.save(); toast('Previewing ' + PLANS[t.dataset.id].name + ' — no charge', 'ok');
  render();
});

/* =========================================================
   Service report
   ========================================================= */
function viewReport(){
  const v = D.cur();
  if (!v) return `<div class="screen">${emptyBox('car','No vehicle','Add a vehicle first.')}</div>`;
  const svc = D.services(v.id).slice().reverse();
  const exps = D.expenses(v.id);
  const total = exps.reduce((a, e) => a + num(e.amount), 0);
  const locked = !can('reports');
  return `<div class="screen">
    <div class="row gap10" style="margin-bottom:18px">
      <button class="backbtn" data-act="back" data-to="home">${icon('back', 18)}</button>
      <div class="grow"><h1 style="font-size:20px">Service report</h1><div class="tiny dim">${esc(vehicleDesc(v))}</div></div>
    </div>
    <div class="card">
      <div class="tiny dim" style="letter-spacing:.1em;text-transform:uppercase;font-weight:700">CarKeeper vehicle history</div>
      <div style="font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:8px">${esc(vehicleDesc(v))}</div>
      <div class="small muted" style="margin-top:4px">${v.vin ? 'VIN ' + esc(v.vin) : 'No VIN'} · ${miles(v.mileage)} mi</div>
      <div class="row gap14 mt12" style="margin-top:14px;flex-wrap:wrap">
        <div><div class="tiny dim">Records</div><div style="font-weight:700">${svc.length}</div></div>
        <div><div class="tiny dim">Total spend</div><div style="font-weight:700">${money(total)}</div></div>
        <div><div class="tiny dim">Generated</div><div style="font-weight:700">${fmtDate(todayISO())}</div></div>
      </div>
    </div>
    <div class="sectitle"><h2>History</h2></div>
    <div class="card" style="padding:4px 16px">
      ${svc.length ? svc.map(s => `<div class="lrow"><div class="ico">${icon(mtById(s.type).icon, 17)}</div>
        <div class="grow"><div class="t">${esc(mtById(s.type).name)}</div><div class="s">${fmtDate(s.date)} · ${miles(s.mileage)} mi${s.shop ? ' · ' + esc(s.shop) : ''}</div></div>
        <div class="amt">${s.cost ? money(s.cost) : '—'}</div></div>`).join('') : '<div class="lrow"><div class="grow"><div class="s" style="padding:10px 0">No records yet.</div></div></div>'}
    </div>
    ${locked ? `<div class="card mt16" style="border-color:rgba(59,130,246,.28);background:rgba(59,130,246,.06)">
      <div class="row gap10"><div style="color:#8AB8FF">${icon('crown', 20)}</div><div class="grow"><div class="small" style="font-weight:650">Downloadable reports are Premium</div>
      <div class="tiny dim" style="margin-top:3px">Upgrade to export a signed history you can hand to a buyer.</div></div></div>
      <button class="btn primary wide sm mt12" data-act="open-plan">See plans</button></div>`
    : `<button class="btn primary wide mt16" data-act="report-download">${icon('download', 17)} Download report</button>
       <button class="btn ghost wide mt12" data-act="report-print">${icon('print', 17)} Print / save PDF</button>`}
  </div>`;
}
function reportHtml(){
  const v = D.cur();
  const svc = D.services(v.id).slice().reverse();
  const exps = D.expenses(v.id);
  const rows = svc.map(s => `<tr><td>${esc(fmtDate(s.date))}</td><td>${esc(mtById(s.type).name)}</td><td>${miles(s.mileage)}</td><td>${s.cost ? money(s.cost) : '—'}</td><td>${esc(s.shop || '—')}</td><td>${esc(s.notes || '')}</td></tr>`).join('');
  return `<!doctype html><html><head><meta charset="utf-8"><title>CarKeeper Service History — ${esc(vehicleDesc(v))}</title>
  <style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#111;max-width:820px;margin:36px auto;padding:0 24px}
  h1{font-size:24px;margin:0 0 4px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#666;margin:26px 0 10px}
  .meta{color:#555;font-size:13px}.box{border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin:18px 0}
  table{width:100%;border-collapse:collapse;font-size:12.5px}th{text-align:left;color:#666;font-weight:600;border-bottom:1px solid #e5e7eb;padding:8px 6px}
  td{border-bottom:1px solid #f1f2f4;padding:8px 6px;vertical-align:top}footer{margin-top:34px;font-size:11px;color:#888;line-height:1.6}
  .brand{font-weight:800;letter-spacing:-.02em}.pill{display:inline-block;background:#eff6ff;color:#1d4ed8;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700}</style></head><body>
  <div class="brand">CarKeeper</div>
  <h1>${esc(vehicleDesc(v))}</h1>
  <div class="meta">${v.nickname ? esc(v.nickname) + ' · ' : ''}${v.vin ? 'VIN ' + esc(v.vin) : 'VIN not recorded'} · ${v.plate ? esc(v.plate) : 'No plate'} · Odometer ${miles(v.mileage)} mi</div>
  <div class="box"><span class="pill">${svc.length} service records</span> &nbsp; <span class="pill">${money(exps.reduce((a, e) => a + num(e.amount), 0))} total cost</span>
  <div style="margin-top:10px;font-size:13px;color:#444">Report generated ${esc(fmtDate(todayISO()))} · CarKeeper</div></div>
  <h2>Service history</h2>
  <table><thead><tr><th>Date</th><th>Service</th><th>Mileage</th><th>Cost</th><th>Provider</th><th>Notes</th></tr></thead><tbody>${rows || '<tr><td colspan="6">No service records.</td></tr>'}</tbody></table>
  <h2>Specifications</h2>
  <table><tbody>
    <tr><td>Engine</td><td>${esc(v.engine || '—')}</td></tr>
    <tr><td>Tire size</td><td>${esc(v.tireSize || '—')}</td></tr>
    <tr><td>Warranty</td><td>${esc(v.warranty || '—')}</td></tr>
    <tr><td>Estimated value</td><td>${v.resale ? money(v.resale) : '—'}</td></tr>
  </tbody></table>
  <footer>This history is self-reported by the vehicle owner and generated by CarKeeper. It is not a mechanical inspection or certification.
  </footer></body></html>`;
}
on('report-download', () => {
  if (!can('reports')) return go('plan');
  const v = D.cur();
  download('carkeeper-history-' + (v.make || 'vehicle') + '-' + todayISO() + '.html', reportHtml(), 'text/html');
  toast('Report downloaded', 'ok');
});
on('report-print', () => {
  if (!can('reports')) return go('plan');
  const w = window.open('', '_blank');
  if (!w) return toast('Allow pop-ups to print', 'bad');
  w.document.write(reportHtml()); w.document.close(); setTimeout(() => w.print(), 500);
});
/* =========================================================
   Boot
   ========================================================= */
(function boot(){
  Store.load(); Cfg.load(); bindModal();
  if (!Store.db.session || !Auth.user()){ Store.db.session = null; state.authMode = 'welcome'; }
  if (document.addEventListener){
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
  }
  /* migrate plans from earlier builds */
  const bootUser = Auth.user();
  if (bootUser && bootUser.plan === 'pro'){ bootUser.plan = 'premium'; Store.save(); }

  render();
  (async () => {
    await PAY.load();
    const q = new URLSearchParams(location.search);
    const flag = q.get('checkout') || q.get('billing') || q.get('session_id');
    if (flag || q.get('session_id')){
      const clean = location.pathname;
      history.replaceState({}, '', clean);
    }
    const user = Auth.user();
    if (user){
      if (q.get('checkout') === 'success'){
        toast('Payment received — activating your plan…', 'ok');
        await pollForActivation(8);
      } else if (q.get('checkout') === 'cancelled'){
        toast('Checkout cancelled — nothing was charged', '');
        await refreshEntitlement();
        render();
      } else {
        const changed = await refreshEntitlement(true);
        if (changed) render();
      }
    }
  })();

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
